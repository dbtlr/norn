[package]
name = "norn-fixtures"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Deterministic fixture-vault generator — synthesizes Markdown test vaults from a (Profile, seed) pair"

[package.metadata.dist]
dist = false

[[bin]]
name = "norn-fixtures"
path = "src/main.rs"

[dependencies]
# `testing::ScratchEnv` builds the isolated environment its oracle probe
# spawns under, so this is a normal dependency, not a dev one.
tempfile = "3"
